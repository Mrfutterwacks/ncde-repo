## NCDE picom config — yshui/picom vgit
## Dedicated config for the New Common Desktop Environment.
## Only NCDE window classes appear here — no Plank, Polybar, etc.

#========================= Corners =========================#
corner-radius = 26;
round-borders = 1;

#========================= Shadows =========================#
shadow = false;
shadow-radius = 12;
shadow-opacity = 0.60;
shadow-offset-x = 0;
shadow-offset-y = 0;
# Cyan glow traces the window border (on ncde-container — opaque, same bbox as frame).
# ncde-frame is ARGB transparent in the center — its shadow bleeds as haze, so excluded.
shadow-red   = 0.0;
shadow-green = 0.9;
shadow-blue  = 1.0;

#========================= Fading =========================#
fading = true;
fade-in-step  = 0.02;
fade-out-step = 0.02;
fade-delta = 8;
no-fading-openclose = false;
no-fading-destroyed-argb = true;

#========================= Opacity =========================#
frame-opacity             = 0.85;

#========================= Blurring =========================#
blur: {
    method           = "dual_kawase";
    strength         = 6;
    background       = true;
    background-frame = true;
    background-fixed = false;
    kern             = "3x3box";
};

#========================= General Settings =========================#
backend          = "glx";
vsync            = true;
# glx-fshader-win  = "/usr/share/ncde/shaders/fake-transparency.glsl";
# force-win-blend  = true;
# glx-no-stencil — REMOVED in picom v13 (glx backend rewrite); errored on login. Disabled.
# glx-no-stencil   = true;
detect-rounded-corners = true;
detect-client-opacity  = true;
# refresh-rate — REMOVED in picom v13 (auto-detected via presentation); errored on login. Disabled.
# refresh-rate     = 0;
detect-transient = true;
detect-client-leader = true;
use-damage       = false;
log-level        = "warn";

#========================= Window rules =========================#
# 2026-09-26: picom v13's rules replace the old per-option match lists (which picom
# ignores once `rules` exists). Every old list is translated 1:1 above its rule, so
# the desktop behaves exactly as before; the window-motion animations (framed
# windows only) are the last rule.
rules = (
    # inactive windows: 85% opacity (overriding their own), 20% dim — was inactive-opacity/-override/-dim;
    # wmwin + override_redirect count as focused (was mark-wmwin-/mark-ovredir-focused)
    { match = "!(focused || group_focused || wmwin || override_redirect)"; opacity = 0.85; opacity-override = true; dim = 0.20; },
    { match = "focused || group_focused || wmwin || override_redirect"; opacity = 1.0; },
    # was focus-exclude: these always count as active — no inactive opacity, no dim
    { match = "(class_g = 'ncde-portal') || (class_g = 'LaPivot') || (class_g = 'ncde-frame') || (class_g = 'ncde-container') || (name = 'ncde-panel-glia') || (name = 'ncde-panel-top') || (name = 'ncde-panel-bottom') || (name = 'ncde-panel-dock') || (name = 'ncde-panel-widget') || (class_g = 'Dunst')"; opacity = 1.0; dim = 0; },
    # was opacity-rule 88
    { match = "(class_g = 'firefox')"; opacity = 0.88; },
    # was opacity-rule 90
    { match = "(class_g = 'Thunar')"; opacity = 0.9; },
    # was opacity-rule 100
    { match = "(class_g = 'ncde-portal') || (name = 'ncde-panel-top') || (name = 'ncde-panel-bottom') || (name = 'ncde-panel-dock') || (class_g = 'LaPivot') || (class_g = 'ncde-frame') || (class_g = 'ncde-container') || (class_g = 'Dunst') || (class_g = 'XTerm') || (class_g = 'URxvt') || (class_g = 'Alacritty') || (class_g = 'Xfce4-terminal') || (class_g = 'Thunderbird')"; opacity = 1.0; },
    # was rounded-corners-exclude (+ fullscreen windows stay square, as before)
    { match = "(class_g = 'LaPivot') || (class_g = 'ncde-frame') || (class_g = 'ncde-container') || (class_g = 'Dunst') || (_GTK_FRAME_EXTENTS@)"; corner-radius = 0; },
    { match = "fullscreen"; corner-radius = 0; },
    # was fade-exclude
    { match = "(class_g = 'ncde-portal') || (class_g = 'LaPivot') || (class_g = 'ncde-frame') || (class_g = 'ncde-container')"; fade = false; },
    # was blur-background-exclude
    { match = "(class_g = 'ncde-portal') || (class_g = 'LaPivot') || (class_g = 'ncde-frame') || (class_g = 'ncde-container') || (name = 'ncde-panel-glia') || (window_type = 'desktop') || (class_g = 'Dunst') || (_GTK_FRAME_EXTENTS@)"; blur-background = false; },
    # was shadow-exclude (shadows are off globally; kept for when they are turned on)
    { match = "(class_g = 'LaPivot') || (class_g = 'ncde-frame') || (name = 'ncde-panel-glia') || (name = 'ncde-panel-top') || (name = 'ncde-panel-bottom') || (name = 'ncde-panel-dock') || (name = 'ncde-panel-widget') || (_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN')"; shadow = false; },
    # was wintypes
    { match = "window_type = 'dock' || window_type = 'dnd' || window_type = 'utility'"; shadow = false; },
    { match = "window_type = 'tooltip'"; opacity = 0.95; dim = 0; shadow = false; full-shadow = false; },
    { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'utility'"; opacity = 1.0; dim = 0; },

    # ── NCDE window motion (2026-09-26, operator-approved) ──────────────────────
    # Framed windows are two sibling X windows (ncde-frame = the brass, drawn by the
    # shell; ncde-container = the app). Every motion scales BOTH toward the same
    # anchor point, so they stay exact scaled copies of each other on every frame.
    # (+ Steam's own client window, which draws its own title bar — never games)
    { match = "class_g = 'ncde-frame' || class_g = 'ncde-container' || class_g = 'steam'";
      animations = (
        # open — DEALT from the deck (tarot, 2026-09-26): the window flies out of the
        # deck at the bottom-centre of the screen along an arc (width and height grow
        # on different curves, so the card bows through the air), overshoots its
        # place by a hair and settles. Frame and app scale about the SAME deck point,
        # so they stay one card the whole way.
        { triggers = [ "open" ];
          var-sx = { curve = "cubic-bezier(0.2, 0.9, 0.3, 1.06)"; duration = 0.44; start = 0.12; end = 1; };
          var-sy = { curve = "cubic-bezier(0.4, 0.55, 0.35, 1.06)"; duration = 0.44; start = 0.12; end = 1; };
          opacity = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = 0.16; start = 0; end = "window-raw-opacity"; };
          var-dx = "window-monitor-x + window-monitor-width / 2";
          var-dy = "window-monitor-y + window-monitor-height";
          scale-x = "var-sx"; scale-y = "var-sy";
          offset-x = "(var-dx - window-x) * (1 - var-sx)";
          offset-y = "(var-dy - window-y) * (1 - var-sy)";
          shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
          shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
        },
        # close — RETURNED to the deck: the same arc in reverse, quicker, fading as it lands
        { triggers = [ "close" ];
          var-sx = { curve = "cubic-bezier(0.55, 0, 0.8, 0.45)"; duration = 0.30; start = 1; end = 0.12; };
          var-sy = { curve = "cubic-bezier(0.45, 0, 0.7, 0.4)"; duration = 0.30; start = 1; end = 0.12; };
          opacity = { curve = "linear"; delay = 0.16; duration = 0.14; start = "window-raw-opacity-before"; end = 0; };
          var-dx = "window-monitor-x + window-monitor-width / 2";
          var-dy = "window-monitor-y + window-monitor-height";
          scale-x = "var-sx"; scale-y = "var-sy";
          offset-x = "(var-dx - window-x) * (1 - var-sx)";
          offset-y = "(var-dy - window-y) * (1 - var-sy)";
          shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
          shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
        },
        # minimize — Genie-style: pinches in at the sides first, then pours down to the
        # bottom of the screen below its centre; fades only at the very end
        { triggers = [ "hide" ];
          var-px = { curve = "cubic-bezier(0.25, 0.6, 0.35, 1)"; duration = 0.42; start = 0; end = 1; };
          var-py = { curve = "cubic-bezier(0.6, 0, 0.9, 0.45)"; duration = 0.42; start = 0; end = 1; };
          opacity = { curve = "linear"; delay = 0.30; duration = 0.12; start = "window-raw-opacity-before"; end = 0; };
          var-ty = "window-monitor-y + window-monitor-height";
          scale-x = "1 - 0.92 * var-px";
          scale-y = "1 - 0.96 * var-py";
          offset-x = "window-width * (1 - scale-x) / 2";
          offset-y = "(var-ty - window-y) * (1 - scale-y)";
          shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
          shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
        },
        # restore — the same funnel, reversed: rises from the panel and opens out
        { triggers = [ "show" ];
          var-px = { curve = "cubic-bezier(0, 0.55, 0.4, 1)"; duration = 0.40; start = 1; end = 0; };
          var-py = { curve = "cubic-bezier(0.1, 0.55, 0.4, 0.75)"; duration = 0.40; start = 1; end = 0; };
          opacity = { curve = "linear"; duration = 0.12; start = 0; end = "window-raw-opacity"; };
          var-ty = "window-monitor-y + window-monitor-height";
          scale-x = "1 - 0.92 * var-px";
          scale-y = "1 - 0.96 * var-py";
          offset-x = "window-width * (1 - scale-x) / 2";
          offset-y = "(var-ty - window-y) * (1 - scale-y)";
          shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
          shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
        }
      );
    }
);
