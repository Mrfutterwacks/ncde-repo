# NCDE "never see a console" policy — logind drop-in.
# Install target: /etc/systemd/logind.conf.d/ncde-console.conf
#
# VT map on the installed system:
#   tty1  -> desktop / ncde-portal greeter   (Ctrl+Alt+F1)
#   tty8  -> graphical System Restore "Soundings", ON DEMAND only (Ctrl+Alt+R).
#            Started by logind as autovt@tty8.service when you switch to tty8,
#            NEVER at boot. ReserveVT=8 makes tty8 eligible for autovt activation
#            even though NAutoVTs=1.
#   tty12 -> emergency "call support" notice (ncde-support-notice.service,
#            WantedBy=multi-user.target; text-only, harmless in the background).
#            No longer hard-reserved, but with NAutoVTs=1 nothing else allocates
#            a VT, so tty12 stays free for it.
#   others-> blank (no dynamic getty)
#
# NAutoVTs=1 stops on-demand text logins on Ctrl+Alt+F2..F11.
[Login]
NAutoVTs=1
ReserveVT=8
