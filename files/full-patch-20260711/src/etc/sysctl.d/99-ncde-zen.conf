# NCDE — Zen kernel network tuning.
#
# BBR congestion control: lower latency / better throughput under contention
# than the stock cubic default (confirmed via /proc/config.gz, 2026-07-01:
# CONFIG_DEFAULT_TCP_CONG="cubic" — BBR is compiled in but NOT the default,
# so this must be set explicitly). fq (fair queueing) is BBR's recommended
# companion qdisc per the upstream BBR documentation — cubic doesn't need it,
# but it doesn't hurt cubic-using connections either.
#
# Requires the tcp_bbr module loaded first — see
# etc/modules-load.d/ncde-bbr.conf (systemd-modules-load.service runs before
# systemd-sysctl.service, so ordering is correct at boot with no extra unit).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# RT safety net (2026-09-30). LaPivot runs SCHED_FIFO 1 (Zen self-boost). With
# the RT throttle off (runtime == period, as found live) a runaway real-time
# task can take every core and freeze Xorg/picom. 950000/1000000 is the kernel's
# own default: real-time work keeps 95% of each CPU, and normal tasks (Xorg,
# picom, the scx_bpfland scheduler's tasks) always keep at least 5%.
kernel.sched_rt_period_us = 1000000
kernel.sched_rt_runtime_us = 950000
