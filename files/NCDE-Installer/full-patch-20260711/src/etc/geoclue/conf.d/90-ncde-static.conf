# NCDE 2026-07-12 — make the static location (/etc/geolocation) authoritative.
#
# Why (proven live on node "ncde"): the WiFi source's beacondb.net lookup has no
# coverage of this area and falls back to GeoIP ("ipf fallback"), and the [ip]
# source is GeoIP too — both resolve the T-Mobile carrier IP to CHICAGO (~170 km
# off), so low-accuracy clients (the desktop widget chain) got Chicago instead of
# the correct /etc/geolocation coords. where-am-i proof: -a 4 -> 41.73,-87.73
# 26 km "ipf fallback"; -a 8 -> 40.766430,-89.467870 (the static file, exact).
# geoclue.conf's own [static-source] note says to disable competing sources.
# This drop-in is only installed on nodes that HAVE /etc/geolocation.

[wifi]
enable=false

[ip]
enable=false
