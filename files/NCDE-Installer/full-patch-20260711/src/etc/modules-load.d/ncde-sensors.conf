# NCDE (2026-07-07) — load the CPU temperature hwmon driver at boot so Sentinel's
# hwmon discovery sees the CPU package sensor and can feed real temps to Lelan
# (io.ncde.Sentinel ThermalChanged → Lelan.sentinelTemps → desktop stats widget).
# Without this, machines whose installer/initramfs doesn't autoload the driver
# expose the CPU only as an ACPI thermal zone, which Sentinel does not read.
# Both drivers are listed on purpose: the one that doesn't match the CPU simply
# fails to bind and is ignored (systemd-modules-load logs it and continues).
coretemp
k10temp
