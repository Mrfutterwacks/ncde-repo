# NCDE — fast Xorg startup: modesetting uses KMS already set by the kernel,
# so Xorg skips hardware probing entirely. Works on Intel, AMD, NVIDIA (nouveau).
Section "Device"
    Identifier  "ncde-gpu"
    Driver      "modesetting"
    Option      "AccelMethod"  "glamor"
    Option      "DRI"          "3"
    # No KMS page flips: picom always composites, so flips only ever hit the overlay window. With them on,
    # logging out and straight back in (same -noreset server) freed the screen pixmap mid-flip and Xorg
    # segfaulted in modesetting dispatch_dirty_region (cores 2026-09-30 19:43, 21:11; 2026-10-01 18:29).
    Option      "PageFlip"     "false"
EndSection

Section "Screen"
    Identifier   "ncde-screen"
    Device       "ncde-gpu"
    DefaultDepth 24
    SubSection "Display"
        Depth  24
        Modes  "1920x1200"
    EndSubSection
EndSection

# Blank time 0 — let NCDE's own screensaver/lock handle idle (xss-lock)
Section "ServerFlags"
    Option  "BlankTime"    "0"
    Option  "StandbyTime"  "0"
    Option  "SuspendTime"  "0"
    Option  "OffTime"      "0"
EndSection
