# NCDE — load the BBR TCP congestion-control module at boot.
# linux-zen compiles it as a module (CONFIG_TCP_CONG_BBR=m), not built-in —
# confirmed via /proc/config.gz, 2026-07-01. Without this, 99-ncde-zen.conf's
# net.ipv4.tcp_congestion_control=bbr sysctl would fail at boot (module not
# loaded yet) since systemd-sysctl.service runs before anything else would
# have pulled it in on demand.
tcp_bbr
