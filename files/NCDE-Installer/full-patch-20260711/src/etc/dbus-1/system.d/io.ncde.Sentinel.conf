<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->

<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the service — ncde-sentinel now runs as a root system
       service (see ncde-sentinel.service) so it can also apply Zen-kernel
       sysfs/procfs switches (cpufreq governor, vm.dirty_ratio) directly. -->
  <policy user="root">
    <allow own="io.ncde.Sentinel"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.ncde.Sentinel"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.ncde.Sentinel"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="io.ncde.Sentinel"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.ncde.Sentinel"
           send_interface="io.ncde.Sentinel"/>
  </policy>
</busconfig>
