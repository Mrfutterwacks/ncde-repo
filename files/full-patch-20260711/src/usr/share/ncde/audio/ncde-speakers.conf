# ncde-speakers.conf — NCDE built-in speaker processing (operator decision 2026-09-30:
# "sound should be loud and utilize the full speakers"; EQ + compressor + limiter, internal
# speakers only, headphones/HDMI/Bluetooth untouched, every machine).
#
# Runs as its own PipeWire client (ncde-speakers.service: `pipewire -c <this file>`), so it never
# requires restarting the user's audio server. It is a WirePlumber SMART FILTER that starts
# DISABLED and targetless; ncde-speakers-guard decides at runtime (via the "filters" metadata)
# which sink it sits in front of — the sink that is device.form-factor=internal AND whose active
# port is a Speaker — and disables it whenever that is not true (headphones plugged, HDMI, BT,
# desktops without internal speakers). Disabled = streams link straight to the device.
#
# Chain per channel: highpass 120 Hz (small speakers cannot reproduce below ~150 Hz; removing it
# frees headroom for loudness) -> +2 dB body @250 Hz -> +2 dB presence @3.2 kHz ->
# stereo compressor (swh sc4: -22 dB threshold, 3:1, soft knee, +7 dB makeup) ->
# lookahead limiter (swh fastLookaheadLimiter, -1 dBFS ceiling: loud, never clips).
# Requires: swh-plugins (LADSPA).

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
      args = { nice.level = -11 }
      flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "NCDE Speakers"
        media.name       = "NCDE Speakers"
        filter.graph = {
          nodes = [
            { type = builtin label = bq_highpass name = hpL  control = { "Freq" = 120.0 "Q" = 0.707 } }
            { type = builtin label = bq_highpass name = hpR  control = { "Freq" = 120.0 "Q" = 0.707 } }
            { type = builtin label = bq_peaking  name = bodyL control = { "Freq" = 250.0 "Q" = 0.9 "Gain" = 2.0 } }
            { type = builtin label = bq_peaking  name = bodyR control = { "Freq" = 250.0 "Q" = 0.9 "Gain" = 2.0 } }
            { type = builtin label = bq_peaking  name = presL control = { "Freq" = 3200.0 "Q" = 1.0 "Gain" = 2.0 } }
            { type = builtin label = bq_peaking  name = presR control = { "Freq" = 3200.0 "Q" = 1.0 "Gain" = 2.0 } }
            { type = ladspa plugin = sc4_1882 label = sc4 name = comp
              control = { "RMS/peak" = 0.5 "Attack time (ms)" = 5.0 "Release time (ms)" = 120.0
                          "Threshold level (dB)" = -22.0 "Ratio (1:n)" = 3.0 "Knee radius (dB)" = 8.0
                          "Makeup gain (dB)" = 7.0 } }
            { type = ladspa plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter name = lim
              control = { "Input gain (dB)" = 0.0 "Limit (dB)" = -1.0 "Release time (s)" = 0.08 } }
          ]
          links = [
            { output = "hpL:Out"   input = "bodyL:In" }
            { output = "bodyL:Out" input = "presL:In" }
            { output = "presL:Out" input = "comp:Left input" }
            { output = "hpR:Out"   input = "bodyR:In" }
            { output = "bodyR:Out" input = "presR:In" }
            { output = "presR:Out" input = "comp:Right input" }
            { output = "comp:Left output"  input = "lim:Input 1" }
            { output = "comp:Right output" input = "lim:Input 2" }
          ]
          inputs  = [ "hpL:In" "hpR:In" ]
          outputs = [ "lim:Output 1" "lim:Output 2" ]
        }
        audio.channels = 2
        audio.position = [ FL FR ]
        capture.props = {
          node.name             = "effect_input.ncde_speakers"
          media.class           = Audio/Sink
          filter.smart          = true
          filter.smart.name     = "ncde-speakers"
          filter.smart.disabled = true
        }
        playback.props = {
          node.name    = "effect_output.ncde_speakers"
          node.passive = true
        }
      }
    }
]
