# === NCDE / Vesper rkhunter false-positive whitelist ==========================
# Appended by the NCDE live patch. These suppress KNOWN-BENIGN desktop warnings so
# Vesper never cries wolf. Directives verified against rkhunter.conf documentation.
#
#   ALLOWIPCPROC = process pathnames permitted to hold large shared-memory segments
#   ALLOWDEVFILE = /dev file names (wildcards ok) that are NOT suspicious
# (The "file properties have changed" class — e.g. /usr/bin/telnet after a package
#  update — is cleared by `rkhunter --propupd`, not by config; Vesper offers that.)

# dunst — the desktop notification daemon legitimately uses a ~1MB shared segment
ALLOWIPCPROC=/usr/bin/dunst

# Steam (flatpak) IPC shared-memory objects under /dev/shm
ALLOWDEVFILE=/dev/shm/flatpak-com.valvesoftware.Steam-*
ALLOWDEVFILE=/dev/shm/flatpak-com.valvesoftware.Steam-*/*
ALLOWDEVFILE=/dev/shm/u*-ValveIPCSharedObj*
ALLOWDEVFILE=/dev/shm/u*-Shm_*

# PulseAudio / PipewirePulse shared-memory files
ALLOWDEVFILE=/dev/shm/pulse-*
ALLOWIPCPROC=/usr/bin/pipewire
ALLOWIPCPROC=/usr/bin/wireplumber
# =============================================================================
