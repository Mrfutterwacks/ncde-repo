## NCDE picom config — yshui/picom vgit
## Dedicated config for the New Common Desktop Environment.
## Only NCDE window classes appear here — no Plank, Polybar, etc.

#========================= Corners =========================#
corner-radius = 26;
rounded-corners-exclude = [
    "class_g = 'LaPivot'",
    "class_g = 'ncde-test'",
    "class_g = 'ncde-frame'",
    "class_g = 'ncde-container'",
    "_GTK_FRAME_EXTENTS@"
];
round-borders = 1;

#========================= Shadows =========================#
shadow = false;
shadow-radius = 12;
shadow-opacity = 0.60;
shadow-offset-x = 0;
shadow-offset-y = 0;
# Cyan glow traces the window border (on ncde-container — opaque, same bbox as frame).
# ncde-frame is ARGB transparent in the center — its shadow bleeds as haze, so excluded.
shadow-red   = 0.0;
shadow-green = 0.9;
shadow-blue  = 1.0;
shadow-exclude = [
    "class_g = 'LaPivot'",
    "class_g = 'ncde-test'",
    "class_g = 'ncde-frame'",
    "name    = 'ncde-panel-glia'",
    "name    = 'ncde-panel-top'",
    "name    = 'ncde-panel-bottom'",
    "name    = 'ncde-panel-dock'",
    "name    = 'ncde-panel-widget'",
    "_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'"
];

#========================= Fading =========================#
fading = true;
fade-in-step  = 0.02;
fade-out-step = 0.02;
fade-delta = 8;
no-fading-openclose = false;
no-fading-destroyed-argb = true;
fade-exclude = [
    "class_g = 'ncde-portal'",
    "class_g = 'LaPivot'",
    "class_g = 'ncde-test'",
    "class_g = 'ncde-frame'",
    "class_g = 'ncde-container'"
];

#========================= Opacity =========================#
inactive-opacity          = 0.85;
frame-opacity             = 0.85;
inactive-opacity-override = true;
active-opacity            = 1.0;
inactive-dim              = 0.20;
focus-exclude = [
    "class_g = 'ncde-portal'",
    "class_g = 'LaPivot'",
    "class_g = 'ncde-test'",
    "class_g = 'ncde-frame'",
    "class_g = 'ncde-container'",
    "name    = 'ncde-panel-glia'",
    "name    = 'ncde-panel-top'",
    "name    = 'ncde-panel-bottom'",
    "name    = 'ncde-panel-dock'",
    "name    = 'ncde-panel-widget'"
];
opacity-rule = [
    "100:class_g = 'ncde-portal'",
    "100:name    = 'ncde-panel-top'",
    "100:name    = 'ncde-panel-bottom'",
    "100:name    = 'ncde-panel-dock'",
    "100:class_g = 'LaPivot'",
    "100:class_g = 'ncde-test'",
    "100:class_g = 'ncde-frame'",
    "100:class_g = 'ncde-container'",
    "100:class_g = 'XTerm'",
    "100:class_g = 'URxvt'",
    "100:class_g = 'Alacritty'",
    "100:class_g = 'Xfce4-terminal'",
    "88:class_g  = 'firefox'",
    "100:class_g = 'Thunderbird'",
    "90:class_g  = 'Thunar'"
];

#========================= Blurring =========================#
blur: {
    method           = "dual_kawase";
    strength         = 6;
    background       = true;
    background-frame = true;
    background-fixed = false;
    kern             = "3x3box";
};
blur-background-exclude = [
    "class_g       = 'ncde-portal'",
    "class_g       = 'LaPivot'",
    "class_g       = 'ncde-test'",
    "class_g       = 'ncde-frame'",
    "class_g       = 'ncde-container'",
    "name          = 'ncde-panel-glia'",
    "window_type   = 'desktop'",
    "_GTK_FRAME_EXTENTS@"
];

#========================= General Settings =========================#
backend          = "glx";
vsync            = true;
# glx-fshader-win  = "/usr/share/ncde/shaders/fake-transparency.glsl";
# force-win-blend  = true;
# glx-no-stencil — REMOVED in picom v13 (glx backend rewrite); errored on login. Disabled.
# glx-no-stencil   = true;
mark-wmwin-focused    = true;
mark-ovredir-focused  = true;
detect-rounded-corners = true;
detect-client-opacity  = true;
# refresh-rate — REMOVED in picom v13 (auto-detected via presentation); errored on login. Disabled.
# refresh-rate     = 0;
detect-transient = true;
detect-client-leader = true;
use-damage       = false;
log-level        = "warn";

wintypes:
{
    dock         = { shadow = false; };
    dnd          = { shadow = false; };
    tooltip      = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
    popup_menu   = { opacity = 1.0; };
    dropdown_menu = { opacity = 1.0; };
    utility      = { shadow = false; opacity = 1.0; };
};
